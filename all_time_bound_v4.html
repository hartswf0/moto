<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="All-Time scoring and playlist instrument" />
  <title>All-Time</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #000;
      --soft: #f3f3f3;
      --muted: #555;
      --header-h: 176px;
      --column-w: min(430px, 92vw);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.4;
    }

    button,
    select,
    input,
    textarea,
    a {
      font: inherit;
      color: inherit;
    }

    button,
    select,
    input,
    textarea {
      border-radius: 0;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .player {
      z-index: 30;
      display: grid;
      grid-template-columns: 118px 1fr;
      border-bottom: 2px solid var(--ink);
      background: var(--paper);
      min-height: var(--header-h);
    }

    .art {
      border-right: 2px solid var(--ink);
      background: var(--soft);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.35);
    }

    .mark {
      font-weight: 950;
      font-size: 1.45rem;
      letter-spacing: 0.06em;
    }

    .deck {
      min-width: 0;
      display: grid;
      grid-template-rows: 28px minmax(0, 1fr) 34px 38px;
    }

    .deck-top {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 2px solid var(--ink);
      font-size: 0.66rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 0;
    }

    .hub {
      min-height: 100%;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-right: 1px solid var(--ink);
      text-decoration: none;
    }

    .top-tool {
      min-height: 24px;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      text-transform: uppercase;
      font-size: 0.62rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      padding: 0 9px;
      cursor: pointer;
    }

    .top-tool:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .state,
    .time {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 7px 8px;
    }

    .now h1 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 3.1rem);
      line-height: 0.96;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .now p {
      margin: 5px 0 0;
      font-size: 0.72rem;
      font-weight: 950;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scrub {
      border-top: 2px solid var(--ink);
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
    }

    .scrub span {
      font-size: 0.64rem;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .scrub input {
      width: 100%;
      accent-color: var(--ink);
      touch-action: pan-x;
    }

    .transport {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      border-top: 2px solid var(--ink);
    }

    .btn,
    .mini,
    .select {
      min-width: 0;
      min-height: 34px;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 8px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .transport .btn {
      border: 0;
      border-right: 2px solid var(--ink);
      min-height: 36px;
    }

    .transport .btn:last-child {
      border-right: 0;
    }

    .primary,
    .btn:hover,
    .mini:hover,
    .unit:hover,
    .unit.active,
    .unit.selected {
      background: var(--ink);
      color: var(--paper);
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      background: var(--paper);
      scrollbar-width: thin;
      scrollbar-color: var(--ink) var(--paper);
    }

    .column {
      flex: 0 0 var(--column-w);
      width: var(--column-w);
      min-width: var(--column-w);
      height: 100%;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      border-right: 2px solid var(--ink);
      background: var(--paper);
      scroll-snap-align: start;
      position: relative;
      transition: border-color 160ms linear;
    }

    .column-header {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      border-bottom: 2px solid var(--ink);
    }

    .column-title {
      min-width: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-transform: uppercase;
    }

    .column-name {
      font-weight: 950;
      letter-spacing: 0.12em;
    }

    .column-subtitle {
      margin-top: 2px;
      font-size: 0.64rem;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .column-content {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--ink) var(--paper);
    }

    .unit {
      width: 100%;
      border: 2px solid var(--ink);
      background: var(--paper);
      margin-bottom: 10px;
      text-align: left;
      display: block;
      cursor: pointer;
      transition: background 120ms linear, color 120ms linear, transform 180ms ease, outline-color 180ms ease;
      position: relative;
    }

    .slot-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
      margin-bottom: 10px;
    }

    .slot-num {
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 58px;
      font-size: 0.88rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .slot-row .unit {
      margin-bottom: 0;
    }

    .slot-row.displaced .slot-num,
    .slot-row.ready .slot-num {
      background: var(--ink);
      color: var(--paper);
    }

    .unit::after,
    .block::after {
      content: "";
      position: absolute;
      right: -2px;
      top: 50%;
      width: 12px;
      height: 24px;
      background: var(--paper);
      border: 2px solid currentColor;
      border-right: 0;
      transform: translate(50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .unit:hover::after,
    .unit.active::after,
    .unit.selected::after,
    .unit.now-playing::after,
    .block:hover::after,
    .block.now-playing::after {
      background: var(--ink);
    }

    .unit.dragging {
      opacity: 0.55;
      outline: 4px double var(--ink);
      outline-offset: -7px;
    }

    .unit.held,
    .slot-row.held .unit {
      outline: 6px double var(--ink);
      outline-offset: -9px;
    }

    .unit.displaced {
      transform: translateY(8px);
      outline: 5px double var(--ink);
      outline-offset: -8px;
    }

    .unit.snap-accept,
    .block.snap-accept,
    .socket-zone.snap-accept {
      animation: snapAccept 520ms ease both;
    }

    .unit.snap-refuse,
    .block.snap-refuse,
    .socket-zone.snap-refuse {
      animation: snapRefuse 360ms ease both;
    }

    .unit.now-playing,
    .block.now-playing {
      background: var(--ink);
      color: var(--paper);
      animation: attentionPulse 760ms ease both;
    }

    .unit.parent-lit {
      outline: 4px double var(--ink);
      outline-offset: -7px;
    }

    .unit.moved-up {
      animation: moveUp 560ms ease both;
    }

    .unit.moved-down {
      animation: moveDown 560ms ease both;
    }

    .unit-body {
      padding: 10px;
      display: grid;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .unit-id {
      width: max-content;
      border-bottom: 1px solid currentColor;
      text-transform: uppercase;
      font-size: 0.62rem;
      font-weight: 950;
      letter-spacing: 0.11em;
      padding-bottom: 2px;
    }

    .unit-label {
      min-width: 0;
      text-transform: uppercase;
      font-size: 0.98rem;
      font-weight: 950;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .unit-meta,
    .hint,
    .field {
      min-width: 0;
      color: #333;
      text-transform: uppercase;
      font-size: 0.66rem;
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unit:hover .unit-meta,
    .unit.active .unit-meta,
    .unit.selected .unit-meta,
    .unit:hover .hint,
    .unit.active .hint,
    .unit.selected .hint,
    .unit:hover .field,
    .unit.active .field,
    .unit.selected .field {
      color: var(--paper);
    }

    .unit:hover .mini,
    .unit.active .mini,
    .unit.selected .mini,
    .unit:hover .select,
    .unit.active .select,
    .unit.selected .select,
    .unit:hover .note-input,
    .unit.active .note-input,
    .unit.selected .note-input,
    .unit:hover .drag-handle,
    .unit.active .drag-handle,
    .unit.selected .drag-handle {
      border-color: var(--paper);
    }

    .unit:hover .mini:hover,
    .unit.active .mini:hover,
    .unit.selected .mini:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .unit-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .song-shell {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
    }

    .thumb {
      border: 1px solid currentColor;
      min-height: 62px;
      background: var(--soft);
      display: grid;
      place-items: center;
      overflow: hidden;
      align-self: stretch;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.25);
    }

    .thumb span {
      font-size: 0.62rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .song-shell .unit-id,
    .song-shell .unit-label,
    .song-shell .unit-meta {
      display: block;
    }

    .drag-handle {
      min-height: 40px;
      border: 1px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      font-size: 0.58rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      cursor: grab;
      user-select: none;
    }

    .move-rail {
      display: grid;
      grid-template-columns: minmax(74px, 1fr) minmax(108px, 1.6fr) minmax(74px, 1fr);
      gap: 5px;
    }

    .move-rail .mini,
    .move-rail .drag-handle {
      min-height: 48px;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      width: 100%;
    }

    .move-btn {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 7px;
      align-items: center;
      justify-content: center;
    }

    .move-icon {
      border: 1px solid currentColor;
      min-width: 22px;
      min-height: 22px;
      display: inline-grid;
      place-items: center;
      font-size: 0.82rem;
      line-height: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      border: 1px solid currentColor;
      padding: 2px 6px;
      text-transform: uppercase;
      font-size: 0.58rem;
      font-weight: 950;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .stars {
      font-weight: 950;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .rating-rail {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
    }

    .star-btn {
      min-height: 34px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font-size: 0.76rem;
      font-weight: 950;
      cursor: pointer;
      text-align: center;
    }

    .star-btn.on,
    .star-btn:hover {
      background: currentColor;
    }

    .star-btn.on span,
    .star-btn:hover span {
      color: var(--paper);
    }

    .toolbar {
      border: 2px solid var(--ink);
      padding: 8px;
      margin-bottom: 10px;
      display: grid;
      gap: 8px;
      background: var(--paper);
    }

    .toolbar-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.07em;
    }

    .socket-zone {
      border: 2px dashed var(--ink);
      background:
        repeating-linear-gradient(90deg, transparent 0 12px, rgba(0,0,0,0.05) 12px 24px),
        var(--paper);
      padding: 8px;
      min-height: 44px;
      display: grid;
      align-content: center;
      text-transform: uppercase;
      font-size: 0.64rem;
      font-weight: 950;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }

    .socket-zone.ready {
      outline: 5px double var(--ink);
      outline-offset: -8px;
    }

    .socket-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .beat-strip {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .beat-pill {
      min-height: 30px;
      flex: 0 0 auto;
      border: 1px solid var(--ink);
      padding: 0 8px;
      background: var(--paper);
      text-transform: uppercase;
      font-size: 0.62rem;
      font-weight: 950;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .beat-pill.active,
    .beat-pill:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .actions.three {
      grid-template-columns: minmax(0, 1fr) 72px 72px;
    }

    .actions.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .unit-ops {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    .unit-ops .mini,
    .unit-ops .select {
      min-height: 30px;
      font-size: 0.6rem;
      padding: 0 5px;
    }

    .unit-fields {
      grid-template-columns: minmax(0, 1fr);
    }

    .media-ops {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(82px, 0.8fr);
    }

    .select {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      display: block;
      padding: 0 8px;
    }

    .beat {
      border: 2px solid var(--ink);
      margin-bottom: 12px;
      background: var(--paper);
    }

    .beat-head {
      min-height: 42px;
      border-bottom: 2px solid var(--ink);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-transform: uppercase;
      font-weight: 950;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .beat.active .beat-head {
      background: var(--ink);
      color: var(--paper);
    }

    .beat-body {
      padding: 8px;
      min-height: var(--beat-h, 110px);
      background:
        linear-gradient(180deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        var(--paper);
      background-size: 100% 24px;
      transition: outline-color 160ms ease, background 160ms ease;
    }

    .block {
      border: 1px solid var(--ink);
      background: var(--paper);
      min-height: 42px;
      height: var(--block-h, 56px);
      margin-bottom: 6px;
      display: grid;
      align-content: center;
      padding: 7px;
      text-transform: uppercase;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .block:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .block-title {
      font-weight: 950;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .block-meta {
      font-size: 0.62rem;
      font-weight: 850;
      opacity: 0.75;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      border: 1px solid var(--ink);
      padding: 14px;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1.45;
    }

    .export-box {
      margin-top: 12px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      border: 1px solid var(--ink);
      background: var(--paper);
      padding: 10px;
      resize: vertical;
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .note-input {
      min-height: 30px;
      width: 100%;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 0 7px;
      resize: none;
      text-transform: uppercase;
      font-size: 0.6rem;
      font-weight: 850;
      overflow: hidden;
      white-space: nowrap;
    }


    /* V4 BIND-BACK: lego blocks, fixed play controls, ghost provenance, split exports */
    .unit,.beat,.export-card,.ghost-strip,.socket-zone,.play-control,.export-btn{border-radius:0}
    .lego-card .unit-body{grid-template-columns:minmax(0,1fr);gap:8px}
    .card-line{display:grid;grid-template-columns:58px minmax(0,1fr) 54px;gap:8px;align-items:stretch}
    .card-copy{min-width:0;display:grid;align-content:center;gap:4px}
    .play-control{min-width:52px;min-height:52px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;cursor:pointer;text-transform:uppercase;font-weight:950;letter-spacing:.08em;padding:0}
    .play-control .play-icon{font-size:1.05rem;line-height:1}.play-control .play-word{display:none}
    .play-control.is-playing,.unit.now-playing .play-control,.block.now-playing .play-control{outline:3px double currentColor;outline-offset:-7px}
    .unit:hover .play-control,.unit.active .play-control,.unit.selected .play-control{background:var(--paper);color:var(--ink);border-color:var(--paper)}
    .lego-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(72px,.72fr) minmax(72px,.72fr);gap:6px}
    .ghost-strip,.provenance-strip{min-height:30px;border:1px dashed var(--ink);background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 9px,transparent 9px 18px),var(--paper);color:var(--muted);display:grid;place-items:center;text-transform:uppercase;font-size:.6rem;font-weight:950;letter-spacing:.08em}
    .unit.now-playing .ghost-strip,.unit.now-playing .provenance-strip{border-color:var(--paper);color:var(--paper);background:transparent}
    .now-chip{background:var(--ink);color:var(--paper);border-color:var(--ink)}.unit.now-playing .now-chip,.block.now-playing .now-chip{background:var(--paper);color:var(--ink);border-color:var(--paper)}
    .beat{overflow:hidden}.beat-head{gap:10px}.beat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.beat-time{flex:0 0 auto;font-variant-numeric:tabular-nums}
    .beat-body{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;align-items:stretch;padding:8px;min-height:auto}
    .time-rail{border-right:2px solid var(--ink);display:flex;flex-direction:column;justify-content:space-between;font-size:.58rem;font-weight:950;text-transform:uppercase;padding:3px 5px 3px 0;font-variant-numeric:tabular-nums}
    .beat-stack{min-width:0;display:grid;gap:6px}
    .block{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:7px;margin-bottom:0}
    .block-time{font-size:.58rem;font-weight:950;font-variant-numeric:tabular-nums;opacity:.9}.block-copy{min-width:0;display:grid;gap:2px}.block-duration{font-size:.62rem;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}.beat-drop{grid-column:1/-1;margin-top:2px}
    .export-card{border:2px solid var(--ink);background:var(--paper);margin-bottom:10px;padding:8px;display:grid;gap:8px}

    .export-line{display:grid;grid-template-columns:42px minmax(0,1fr) 54px;gap:8px;align-items:stretch}

    .export-card.active-target .export-btn:hover span,.export-card.now-playing .export-btn:hover span{color:var(--ink)}
    .legend-bar{border:2px solid var(--ink);padding:8px;margin-top:10px;display:grid;gap:6px;text-transform:uppercase;font-size:.62rem;font-weight:950;letter-spacing:.06em}
    .legend-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.legend-swatch{width:22px;height:22px;border:2px solid var(--ink);display:inline-block;vertical-align:middle}.legend-swatch.dark{background:var(--ink)}.legend-swatch.ghost{border-style:dashed;background:var(--paper)}
    .grab-banner{border:3px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px;margin-bottom:10px;display:grid;gap:8px;text-transform:uppercase;font-size:.68rem;font-weight:950;letter-spacing:.07em}.grab-banner .mini{border-color:var(--paper);color:var(--paper);background:var(--ink)}.grab-banner .mini:hover{background:var(--paper);color:var(--ink)}

    @keyframes moveUp {
      0% { transform: translateY(12px); outline: 4px double var(--ink); }
      45% { transform: translateY(-7px); outline: 4px double var(--ink); }
      100% { transform: translateY(0); outline: 0 solid transparent; }
    }

    @keyframes moveDown {
      0% { transform: translateY(-12px); outline: 4px double var(--ink); }
      45% { transform: translateY(7px); outline: 4px double var(--ink); }
      100% { transform: translateY(0); outline: 0 solid transparent; }
    }

    @keyframes attentionPulse {
      0% { transform: scale(0.985); outline: 5px double currentColor; outline-offset: -8px; }
      55% { transform: scale(1.01); outline: 5px double currentColor; outline-offset: -8px; }
      100% { transform: scale(1); outline: 0 solid transparent; }
    }

    @keyframes snapAccept {
      0% { transform: scale(0.985); outline: 6px double var(--ink); outline-offset: -9px; }
      50% { transform: scale(1.018); outline: 6px double var(--ink); outline-offset: -9px; }
      100% { transform: scale(1); outline: 0 solid transparent; }
    }

    @keyframes snapRefuse {
      0%, 100% { transform: translateX(0); outline: 4px double var(--ink); outline-offset: -7px; }
      25% { transform: translateX(-7px); }
      55% { transform: translateX(7px); }
      80% { transform: translateX(-4px); }
    }

    @media (max-width: 760px) {
      :root {
        --header-h: 150px;
        --column-w: 100vw;
      }

      .player {
        grid-template-columns: 82px 1fr;
      }

      .deck {
        grid-template-rows: 24px minmax(0, 1fr) 30px 36px;
      }

      .deck-top,
      .unit-meta,
      .hint,
      .field {

      }

      .now {

      }

      .now h1 {
        font-size: clamp(1rem, 6.2vw, 1.72rem);
      }

      .now p {

      }

      .actions.three {

      }

      .actions.four {

    }

    ::-webkit-scrollbar {

    }

    ::-webkit-scrollbar-track {
      background: var(--paper);
      border-left: 1px solid var(--ink);
    }
