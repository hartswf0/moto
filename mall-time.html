<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="THE MALL scoring playlist board" />
  <title>Mall Time</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --soft: #f2f2f2;
      --line: #000000;
      --accent: #000000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
    }

    button,
    a,
    select,
    input {
      font: inherit;
      color: inherit;
    }

    .shell {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .topbar,
    .player,
    .panel {
      border: 2px solid var(--line);
      background: var(--paper);
    }

    .topbar {
      min-height: 42px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: stretch;
    }

    .nav,
    .brand,
    .count {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 950;
      letter-spacing: 0.08em;
      font-size: 0.76rem;
    }

    .brand {
      border-left: 2px solid var(--line);
      border-right: 2px solid var(--line);
      background: var(--ink);
      color: var(--paper);
    }

    .player {
      display: grid;
      grid-template-columns: 118px 1fr;
      min-height: 118px;
    }

    .art {
      border-right: 2px solid var(--line);
      background: var(--soft);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.45);
    }

    .art .mark {
      font-size: 1.6rem;
      font-weight: 950;
    }

    .now {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .now-top {
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 2px solid var(--line);
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .now h1 {
      margin: 0;
      padding: 7px 8px 3px;
      font-size: clamp(1.25rem, 5vw, 3rem);
      line-height: 0.96;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .now p {
      margin: 0;
      padding: 0 8px 7px;
      text-transform: uppercase;
      font-weight: 850;
      font-size: 0.8rem;
    }

    .song-scrub-wrap {
      border-top: 2px solid var(--line);
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      min-height: 34px;
      padding: 0 7px;
      gap: 7px;
    }

    .song-scrub-wrap span {
      font-size: 0.64rem;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .song-scrub {
      width: 100%;
      accent-color: var(--ink);
      touch-action: pan-x;
    }

    .song-scrub:disabled {
      opacity: 0.45;
    }

    .time-tools {
      display: none;
    }

    .fit-row {
      display: none;
    }

    .tool-row {
      min-width: 0;
      display: grid;
      grid-template-columns: 78px 1fr 68px;
      align-items: center;
      min-height: 34px;
      border-bottom: 2px solid var(--line);
    }

    .tool-row:last-child { border-bottom: 0; }

    .tool-row label,
    .tool-value {
      min-width: 0;
      padding: 0 7px;
      text-transform: uppercase;
      font-weight: 950;
      font-size: 0.64rem;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }

    .tool-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .tool-row input[type="range"] {
      width: 100%;
      accent-color: var(--ink);
    }

    .tool-row select {
      width: 100%;
      min-width: 0;
      height: 100%;
      border: 0;
      border-left: 2px solid var(--line);
      border-right: 2px solid var(--line);
      background: var(--paper);
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 950;
      padding: 0 6px;
    }

    .nudge-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 2px solid var(--line);
    }

    .nudge-row .btn {
      min-height: 32px;
      font-size: 0.64rem;
    }

    .transport {
      display: grid;
      grid-template-columns: 0.85fr 1.2fr 0.85fr 1fr 1fr;
      border-top: 2px solid var(--line);
    }

    .btn {
      min-height: 38px;
      border: 0;
      border-right: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 8px;
      font-size: 0.76rem;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn:last-child { border-right: 0; }
    .btn.primary { background: var(--ink); color: var(--paper); }
    .btn:hover,
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: -5px; }

    .layout {
      display: grid;
      gap: 8px;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
    }

    .panel-head {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 2px solid var(--line);
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 950;
      letter-spacing: 0.08em;
    }

    .move-readout {
      flex: 1;
      min-width: 0;
      color: #333;
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-actions {
      display: inline-flex;
      align-items: stretch;
      gap: 4px;
    }

    .panel-body {
      padding: 6px;
      display: grid;
      gap: 6px;
    }

    .chapters {
      display: grid;
      gap: 6px;
    }

    .chapter {
      border: 1px solid var(--line);
      background: var(--paper);
      display: grid;
      gap: 4px;
      padding: 7px;
      cursor: pointer;
    }

    .chapter.is-current {
      background: var(--ink);
      color: var(--paper);
    }

    .chapter-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-weight: 950;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .chapter p {
      margin: 0;
      font-size: 0.72rem;
      line-height: 1.25;
    }

    .chapter .time {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .playlist {
      display: grid;
      gap: 5px;
    }

    .cue {
      border: 1px solid var(--line);
      background: var(--paper);
      display: grid;
      grid-template-columns: 44px 1fr;
      min-height: 70px;
    }

    .cue.is-current {
      box-shadow: inset 0 0 0 3px var(--ink);
    }

    .cue.is-current .cue-no {
      background: var(--ink);
      color: var(--paper);
    }

    .cue.is-dragging {
      opacity: 0.45;
    }

    .cue.is-moving {
      outline: 3px solid var(--ink);
      outline-offset: -5px;
    }

    .cue.is-drop-target {
      background: var(--soft);
    }

    .cue-no {
      border-right: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .cue-no span {
      display: block;
      font-size: 0.52rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .cue-main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 5px;
      padding: 6px;
    }

    .cue-title {
      min-width: 0;
      font-weight: 950;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cue-meta {
      color: #333;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cue-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 72px;
      gap: 4px;
    }

    .mini,
    .chapter-select,
    .rating-select {
      min-width: 0;
      min-height: 28px;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.64rem;
      font-weight: 950;
      letter-spacing: 0.05em;
    }

    .mini:hover,
    .chapter-select:hover,
    .rating-select:hover,
    .mini:focus-visible,
    .chapter-select:focus-visible,
    .rating-select:focus-visible {
      outline: 2px solid var(--line);
      outline-offset: -4px;
    }

    .chapter-select {
      grid-column: span 2;
      padding: 0 4px;
    }

    .beat-list {
      display: grid;
      gap: 5px;
    }

    .beat {
      border: 1px solid var(--line);
      padding: 7px;
      display: grid;
      gap: 4px;
    }

    .beat strong {
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .beat span {
      font-size: 0.72rem;
      line-height: 1.25;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 8px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
    }

    @media (min-width: 880px) {
      .layout {
        grid-template-columns: 280px minmax(0, 1fr) 300px;
        align-items: start;
      }

      .panel.sticky {
        position: sticky;
        top: 8px;
      }
    }

    @media (max-width: 620px) {
      html,
      body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .shell {
        min-height: 100dvh;
        height: auto;
        max-height: none;
        overflow: visible;
        grid-template-rows: auto auto auto;
        padding: 4px;
      }

      .topbar { display: none; }
      .player {
        grid-template-columns: 82px 1fr;
        min-height: 0;
      }
      .art {
        display: grid;
        min-height: 100%;
      }
      .art .mark {
        font-size: 1.15rem;
      }
      .now-top {
        min-height: 22px;
        font-size: 0.58rem;
        padding: 0 6px;
      }
      .now h1 {
        font-size: clamp(0.94rem, 6.6vw, 1.7rem);
        padding: 5px 6px 1px;
      }
      .now p {
        font-size: 0.61rem;
        padding: 0 6px 4px;
      }
      .song-scrub-wrap {
        grid-template-columns: 42px 1fr 42px;
        min-height: 30px;
        padding: 0 5px;
        gap: 5px;
      }
      .song-scrub-wrap span {
        font-size: 0.56rem;
      }
      .tool-row {
        grid-template-columns: 54px 1fr 50px;
        min-height: 28px;
      }
      .tool-row label,
      .tool-value {
        font-size: 0.56rem;
        padding: 0 5px;
      }
      .tool-row select {
        font-size: 0.62rem;
      }
      .transport { grid-template-columns: 1fr 1fr 1fr; }
      .transport .btn:nth-child(3) { border-right: 0; }
      .transport .btn:nth-child(n+4) { display: none; }
      .layout {
        height: auto;
        min-height: 0;
        overflow: visible;
        grid-template-rows: auto;
      }
      .layout .panel:first-child,
      .layout .panel:last-child {
        display: none;
      }
      .panel,
      .panel-body,
      .playlist {
        min-height: 0;
      }
      .layout > .panel {
        height: auto;
        display: grid;
        grid-template-rows: auto auto;
      }
      .panel-body {
        overflow-y: visible;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: auto;
      }
      .cue {
        min-height: 62px;
        grid-template-columns: 38px 1fr;
      }
      .cue-main {
        gap: 3px;
        padding: 5px;
      }
      .cue-title {
        font-size: 0.82rem;
      }
      .cue-meta {
        font-size: 0.65rem;
      }
      .cue-actions { grid-template-columns: minmax(0, 1fr) 64px 60px; }
      .panel-head {
        gap: 5px;
        padding: 0 5px;
      }
      .panel-head > span:first-child {
        display: none;
      }
      .move-readout {
        text-align: left;
        font-size: 0.58rem;
      }
      .panel-actions .mini {
        min-width: 66px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="nav" href="./index.html">Hub</a>
      <div class="brand">Mall Time</div>
      <div class="count" id="countReadout">31 cues</div>
    </header>

    <section class="player" aria-label="Playlist player">
      <div class="art" id="artBox"><div class="mark">MT</div></div>
      <div class="now">
        <div class="now-top">
          <span id="stateReadout">Recommended Pass</span>
          <span id="timeReadout">0:00 / 26:43</span>
        </div>
        <h1 id="nowTitle">First Cue Ready</h1>
        <p id="nowMeta">Recommended scoring pass for THE MALL</p>
        <div class="song-scrub-wrap" aria-label="Song scrub">
          <span id="scrubNow">0:00</span>
          <input class="song-scrub" id="songScrub" type="range" min="0" max="0" value="0" step="0.01" disabled aria-label="Scrub current song" />
          <span id="scrubEnd">--</span>
        </div>
        <div class="time-tools" aria-label="Cue timing tools">
          <div class="tool-row">
            <label for="activeChapter">Chapter</label>
            <select id="activeChapter"></select>
            <span class="tool-value" id="chapterTime">0:00</span>
          </div>
          <div class="tool-row">
            <label for="hitRange">Start</label>
            <input id="hitRange" type="range" min="0" max="1603" value="0" step="1" aria-label="Cue start time" />
            <span class="tool-value" id="hitValue">0:00</span>
          </div>
          <div class="tool-row">
            <label for="durationRange">Length</label>
            <input id="durationRange" type="range" min="5" max="180" value="45" step="1" aria-label="Cue duration" />
            <span class="tool-value" id="durationValue">0:45</span>
          </div>
          <div class="tool-row fit-row">
            <label for="fitSelect">Fit</label>
            <select id="fitSelect">
              <option value="try">Try</option>
              <option value="good">Good</option>
              <option value="hold">Hold</option>
              <option value="cut">Cut</option>
            </select>
            <span class="tool-value" id="endValue">0:45</span>
          </div>
          <div class="nudge-row">
            <button type="button" class="btn" id="minus15Btn">-15s</button>
            <button type="button" class="btn" id="minus1Btn">-1s</button>
            <button type="button" class="btn" id="plus1Btn">+1s</button>
            <button type="button" class="btn" id="plus15Btn">+15s</button>
          </div>
        </div>
        <div class="transport">
          <button type="button" class="btn" id="prevBtn">Back</button>
          <button type="button" class="btn primary" id="playBtn">Play Pass</button>
          <button type="button" class="btn" id="nextBtn">Next</button>
          <button type="button" class="btn" id="copyBtn">Copy Plan</button>
          <a class="btn" id="songLink" href="./VOLHOLLA/index.html">Song Page</a>
        </div>
      </div>
    </section>

    <section class="layout">
      <aside class="panel sticky">
        <div class="panel-head">
          <span>Film Beats</span>
          <span id="chapterReadout">CH00</span>
        </div>
        <div class="panel-body">
          <div class="chapters" id="chapterList"></div>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <span>Recommended Pass</span>
          <span class="move-readout" id="moveReadout">Drag number to move</span>
          <span class="panel-actions">
            <button type="button" class="mini" id="exportBtn">Export</button>
            <button type="button" class="mini" id="resetBtn">Rebuild</button>
          </span>
        </div>
        <div class="panel-body">
          <div class="playlist" id="playlist"></div>
        </div>
      </section>

      <aside class="panel sticky">
        <div class="panel-head">
          <span>Match Notes</span>
          <button type="button" class="mini" id="saveNoteBtn">Save</button>
        </div>
        <div class="panel-body">
          <div class="beat-list" id="beatList"></div>
          <textarea id="notes" spellcheck="true" placeholder="Notes for sync points, cuts, dialogue gaps, or scenes that need less music."></textarea>
        </div>
      </aside>
    </section>
  </main>

      function buildRecommendedPlan() {
        const chapterRank = Object.fromEntries(chapters.map((chapter, index) => [chapter.id, index]));
        const orderRank = Object.fromEntries(recommendedOrder.map((page, index) => [page, index]));
        const cues = selected.map((item) => {

          return {
            id: item.page,
            page: item.page,
            title: fb[0],
            audio: fb[1],
            art: fb[2],
            chapter: item.chapter,
            note: item.note,
            fit: item.fit || "try",
            stars: Number.isFinite(Number(item.stars)) ? Number(item.stars) : defaultStars(item.fit),
            runtime: null,
            manualTime: null,
            duration: 45,
            order: orderRank[item.page] ?? 999
          };
        }).sort((a, b) => {
          const chapterDelta = (chapterRank[a.chapter] ?? 99) - (chapterRank[b.chapter] ?? 99);
          if (chapterDelta) return chapterDelta;
          return a.order - b.order;
        });

        cues.forEach((cue, index) => { cue.order = index; });
        chapters.forEach((chapter) => {
          const group = cues.filter((cue) => cue.chapter === chapter.id).sort((a, b) => a.order - b.order);
          const spacing = chapter.duration / Math.max(1, group.length + 1);
          const duration = Math.max(18, Math.min(70, spacing * 0.72));
          group.forEach((cue, index) => {
            cue.manualTime = chapter.start + spacing * (index + 1);
            cue.duration = Math.round(duration);
          });
        });
        return cues;

          const saved = JSON.parse(raw);
          if (!Array.isArray(saved)) return;
          const base = Object.fromEntries(buildRecommendedPlan().map((cue) => [cue.id, cue]));

            if (chapters.some((chapter) => chapter.id === item.chapter)) cue.chapter = item.chapter;
            if (Number.isFinite(Number(item.order))) cue.order = Number(item.order);
            if (typeof item.note === "string") cue.note = item.note;
            if (typeof item.fit === "string") cue.fit = item.fit;
            if (Number.isFinite(Number(item.stars))) cue.stars = Math.max(0, Math.min(5, Number(item.stars)));
            if (Number.isFinite(Number(item.manualTime))) cue.manualTime = Number(item.manualTime);
            if (Number.isFinite(Number(item.duration))) cue.duration = Number(item.duration);

        const index = list.findIndex((cue) => cue.id === id);

        if (index < 0 || nextIndex < 0 || nextIndex >= list.length) return;
        const a = list[index];
        const b = list[nextIndex];
        [a.order, b.order] = [b.order, a.order];
        currentIndex = nextIndex;

      function moveCueTo(sourceId, targetId) {

        if (from < 0 || to < 0) return;
        const [moved] = list.splice(from, 1);

        currentIndex = list.findIndex((cue) => cue.id === moved.id);

        els.hitValue.textContent = fmt(cueTime(cue));
        els.durationRange.value = String(Math.round(cueDuration(cue)));
        els.durationValue.textContent = fmt(cueDuration(cue));
        els.fitSelect.value = cue.fit || "try";
        els.endValue.textContent = fmt(cueEnd(cue));
      }

      function renderChapters() {
        els.chapters.innerHTML = chapters.map((chapter) => {
          const count = assignedToChapter(chapter.id).length;
          const end = chapter.start + chapter.duration;
          return `
            <button type="button" class="chapter ${chapter.id === currentChapter ? "is-current" : ""}" data-chapter="${chapter.id}">
              <div class="chapter-top"><span>${chapter.id} / ${chapter.title}</span><span class="time">${fmt(chapter.start)}-${fmt(end)}</span></div>
              <p>${chapter.fn}</p>
              <p>${count} cues / ${chapter.clips} clips</p>
            </button>
          `;
        }).join("");
      }

      function renderPlaylist() {
        const list = sortedPlan();
        if (!list.length) {
          els.playlist.innerHTML = `
            <article class="cue">
              <div class="cue-no">00</div>
              <div class="cue-main">
                <div class="cue-title">No cues in this pass</div>
                <div class="cue-meta">Use Rebuild to restore the recommended pass.</div>
              </div>
            </article>
          `;
          return;
        }
        els.playlist.innerHTML = list.map((cue, index) => {
          const chapter = chapterFor(cue.chapter);
          const hit = cueTime(cue);
          const classes = [
            "cue",
            index === currentIndex ? "is-current" : "",
            cue.id === moveArmedId ? "is-moving" : ""
          ].filter(Boolean).join(" ");
          return `
            <article class="${classes}" data-id="${cue.id}" draggable="true">
              <div class="cue-no">${String(index + 1).padStart(2, "0")}<span>move</span></div>
              <div class="cue-main">
                <div class="cue-title">${cue.title}</div>
                <div class="cue-meta">${chapter.id} ${chapter.title} / ${fmt(hit)} / ${runtimeLabel(cue)} / ${stars(cue)}/5</div>
                <div class="cue-actions">
                  <button type="button" class="mini" data-action="play">Play</button>
                  <select class="rating-select" data-action="stars" aria-label="Stars for ${cue.title}">${starOptions(cue.stars)}</select>
                  <button type="button" class="mini" data-action="delete" aria-label="Cut ${cue.title}">Cut</button>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      function renderBeats() {
        const cues = assignedToChapter(currentChapter);
        const chapter = chapterFor(currentChapter);
        els.beats.innerHTML = cues.map((cue) => `
          <div class="beat">
            <strong>${fmt(cueTime(cue))}-${fmt(cueEnd(cue))} / ${cue.title}</strong>
            <span>${runtimeLabel(cue)} / ${stars(cue)}/5 / ${cue.note}</span>
          </div>
        `).join("") || `
          <div class="beat">
            <strong>${chapter.id} has no cue yet</strong>
            <span>Move a song into this chapter from the playlist.</span>
          </div>
        `;
      }

      function renderNow() {
        const cue = currentCue();
        if (!cue) {
          els.state.textContent = "No Cues";
          els.time.textContent = `0:00 / ${fmt(FILM_DURATION)}`;
          els.title.textContent = "No cues in pass";
          els.meta.textContent = "Rebuild restores the recommended pass";
          els.play.textContent = "Play Pass";
          els.art.innerHTML = `<div class="mark">MT</div>`;
          els.count.textContent = "0 cues";
          els.songScrub.disabled = true;
          els.songScrub.max = "0";
          els.songScrub.value = "0";
          els.scrubNow.textContent = "0:00";
          els.scrubEnd.textContent = "--";
          return;
        }
        const chapter = chapterFor(cue.chapter);
        const playing = !audio.paused && !!audio.src;
        const position = `${String(currentIndex + 1).padStart(2, "0")}/${sortedPlan().length}`;
        const songDuration = currentAudioDuration(cue);
        els.state.textContent = passComplete ? "Pass Complete" : playing ? `Playing ${position}` : audio.src ? `Paused ${position}` : `Ready ${position}`;
        els.time.textContent = audio.src ? `${fmt(audio.currentTime)} / ${fmt(songDuration)}` : runtimeLabel(cue);
        els.title.textContent = cue.title;
        els.meta.textContent = `Cue ${position} / ${chapter.id} ${chapter.title} / ${fmt(cueTime(cue))} / ${stars(cue)}/5`;
        els.play.textContent = playing ? "Pause" : audio.src ? "Resume" : "Play Pass";
        els.songScrub.disabled = !audio.src || songDuration === null;
        els.songScrub.max = songDuration === null ? "0" : String(songDuration);
        if (!isSongScrubbing) els.songScrub.value = songDuration === null ? "0" : String(Math.min(audio.currentTime || 0, songDuration));
        els.scrubNow.textContent = fmt(isSongScrubbing ? Number(els.songScrub.value) : audio.currentTime);
        els.scrubEnd.textContent = songDuration === null ? "--" : fmt(songDuration);
        els.songLink.href = `./${cue.page}`;
        const art = path(cue.art);
        els.art.innerHTML = art ? `<img src="${encodeURI(art)}" alt="${cue.title} artwork">` : `<div class="mark">MT</div>`;
        els.count.textContent = `${plan.length} cues`;
        els.chapterReadout.textContent = `${chapterFor(currentChapter).id} ${chapterFor(currentChapter).title}`;
      }

      function render() {
        normalizeOrder();
        renderChapters();
        renderPlaylist();
        renderBeats();
        renderActiveTools();
        renderNow();
      }

      function exportPlan() {
        const payload = {
          title: "THE MALL score playlist",
          durationSeconds: FILM_DURATION,
          cues: sortedPlan().map((cue, index) => ({
            order: index + 1,
            chapter: cue.chapter,
            chapterTitle: chapterFor(cue.chapter).title,
            start: fmt(cueTime(cue)),
            end: fmt(cueEnd(cue)),
            duration: fmt(cueDuration(cue)),
            runtime: runtime(cue) === null ? null : fmt(runtime(cue)),
            stars: stars(cue),
            fit: cue.fit || "try",
            title: cue.title,
            songPage: cue.page,
            audio: cue.audio,
            note: cue.note
          })),
          notes: els.notes.value || ""
        };
        const text = JSON.stringify(payload, null, 2);
        const flash = () => {
          els.copy.textContent = "Copied";
          els.exportPlan.textContent = "Copied";
          setMoveStatus("Playlist copied");
          setTimeout(() => {
            els.copy.textContent = "Copy Plan";
            els.exportPlan.textContent = "Export";
            setMoveStatus(moveArmedId ? `Moving ${cueMoveLabel(moveArmedId)}. Tap destination.` : "Drag number to move");
          }, 1000);
        };
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            flash();
          }).catch(() => window.prompt("Copy plan", text));
        } else {
          window.prompt("Copy plan", text);
        }
      }

      function applyManifest(manifest) {
        const byPage = {};
        Object.values(manifest?.albums || {}).forEach((album) => {
          (album.tracks || []).forEach((track) => {
            if (!track.songPage) return;
            byPage[track.songPage] = { track, album };
          });
        });
        plan.forEach((cue) => {
          const hit = byPage[cue.page];
          if (!hit) return;
          cue.title = hit.track.title || cue.title;
          cue.audio = hit.track.audio?.source || hit.track.source || cue.audio;
          cue.art = hit.track.art?.source || hit.album.defaultTrackArt?.source || hit.album.cover?.source || cue.art;
        });
      }

      function probeDurations() {
        plan.forEach((cue) => {
          if (!cue.audio || runtime(cue) !== null) return;
          const probe = new Audio();
          const done = () => {
            if (Number.isFinite(probe.duration)) {
              cue.runtime = probe.duration;
              render();
            }
            probe.removeAttribute("src");
            probe.load();
          };
          probe.preload = "metadata";
          probe.addEventListener("loadedmetadata", done, { once: true });
          probe.addEventListener("error", () => {
            probe.removeAttribute("src");
            probe.load();
          }, { once: true });
          probe.src = encodeURI(path(cue.audio));
        });
      }

      els.prev.addEventListener("click", prev);
      els.play.addEventListener("click", playPause);
      els.next.addEventListener("click", next);
      els.copy.addEventListener("click", exportPlan);
      els.exportPlan.addEventListener("click", exportPlan);
      els.reset.addEventListener("click", () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
        plan = buildRecommendedPlan();
        if (cachedManifest) applyManifest(cachedManifest);
        probeDurations();
        passComplete = false;
        moveArmedId = null;
        currentIndex = 0;
        render();
        setMoveStatus("Recommended pass rebuilt");
      });
      els.saveNote.addEventListener("click", () => {
        saveNotes();
        els.saveNote.textContent = "Saved";
        setTimeout(() => { els.saveNote.textContent = "Save"; }, 1000);
      });
      els.playlist.addEventListener("click", (event) => {
        if (suppressCueClick) {
          event.preventDefault();
          return;
        }
        const cueEl = event.target.closest(".cue");
        if (!cueEl) return;
        const cue = plan.find((item) => item.id === cueEl.dataset.id);
        if (!cue) return;
        const action = event.target.dataset.action;
        if (event.target.closest(".cue-no")) {
          armMove(cue.id);
          return;
        }
        if (moveArmedId && !action) {
          moveCueTo(moveArmedId, cue.id);
          return;
        }
        if (action === "play") setCurrentById(cue.id, true);
        if (action === "delete") deleteCue(cue.id);
      });
      els.playlist.addEventListener("change", (event) => {
        const cueEl = event.target.closest(".cue");
        const cue = plan.find((item) => item.id === cueEl?.dataset.id);
        if (!cue) return;
        if (event.target.dataset.action === "stars") {
          cue.stars = Math.max(0, Math.min(5, Number(event.target.value) || 0));
        }
        save();
        render();
      });
      els.playlist.addEventListener("dragstart", (event) => {
        if (!event.target.closest(".cue-no")) {
          event.preventDefault();
          return;
        }
        const cueEl = event.target.closest(".cue");
        if (!cueEl?.dataset.id) return;
        draggedId = cueEl.dataset.id;
        moveArmedId = null;
        setMoveStatus(`Moving ${cueMoveLabel(draggedId)}`);
        cueEl.classList.add("is-dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedId);
      });
      els.playlist.addEventListener("dragend", (event) => {
        event.target.closest(".cue")?.classList.remove("is-dragging");
        document.querySelectorAll(".cue.is-drop-target").forEach((el) => el.classList.remove("is-drop-target"));
        draggedId = null;
      });
      els.playlist.addEventListener("dragover", (event) => {
        if (!draggedId) return;
        const cueEl = event.target.closest(".cue");
        if (!cueEl?.dataset.id || cueEl.dataset.id === draggedId) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        document.querySelectorAll(".cue.is-drop-target").forEach((el) => el.classList.remove("is-drop-target"));
        cueEl.classList.add("is-drop-target");
        setMoveStatus(`Drop on ${cueMoveLabel(cueEl.dataset.id)}`);
      });
      els.playlist.addEventListener("drop", (event) => {
        const cueEl = event.target.closest(".cue");
        if (!cueEl?.dataset.id) return;
        event.preventDefault();
        moveCueTo(draggedId || event.dataTransfer.getData("text/plain"), cueEl.dataset.id);
      });
      els.playlist.addEventListener("pointerdown", (event) => {
        const handle = event.target.closest(".cue-no");
        if (!handle) return;
        const cueEl = handle.closest(".cue");
        if (!cueEl?.dataset.id) return;
        pointerDraggedId = cueEl.dataset.id;
        pointerDragEl = cueEl;
        pointerStart = { x: event.clientX, y: event.clientY };
        moveArmedId = null;
        setMoveStatus(`Moving ${cueMoveLabel(pointerDraggedId)}`);
        cueEl.classList.add("is-dragging");
        handle.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      });
      els.playlist.addEventListener("pointermove", (event) => {
        if (pointerDraggedId) event.preventDefault();
      });
      els.playlist.addEventListener("pointerup", (event) => {
        if (!pointerDraggedId) return;
        suppressCueClick = true;
        setTimeout(() => { suppressCueClick = false; }, 0);
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".cue");
        const movedEnough = pointerStart && Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 12;
        if (movedEnough && target?.dataset.id && target.dataset.id !== pointerDraggedId) {
          moveCueTo(pointerDraggedId, target.dataset.id);
        } else {
          const id = pointerDraggedId;
          clearMoveState();
          armMove(id);
        }
        clearMoveState();
        event.preventDefault();
      });
      els.playlist.addEventListener("pointercancel", () => {
        clearMoveState();
        setMoveStatus(moveArmedId ? `Moving ${cueMoveLabel(moveArmedId)}. Tap destination.` : "Drag number to move");
      });
      els.chapters.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-chapter]");
        if (!btn) return;
        currentChapter = btn.dataset.chapter;
        render();
      });
      els.activeChapter.addEventListener("change", () => {
        const cue = currentCue();
        if (!cue) return;
        const chapter = chapterFor(els.activeChapter.value);
        cue.chapter = chapter.id;
        cue.manualTime = chapter.start + Math.min(10, chapter.duration / 3);
        currentChapter = chapter.id;
        save();
        render();
      });
      els.hitRange.addEventListener("input", () => {
        const cue = currentCue();
        if (!cue) return;
        cue.manualTime = clampTime(Number(els.hitRange.value));
        currentChapter = chapterAt(cue.manualTime).id;
        cue.chapter = currentChapter;
        renderActiveTools();
        renderNow();
      });
      els.hitRange.addEventListener("change", () => {
        const cue = currentCue();
        if (!cue) return;
        setCueTime(cue, Number(els.hitRange.value));
      });
      els.durationRange.addEventListener("input", () => {
        const cue = currentCue();
        if (!cue) return;
        cue.duration = Number(els.durationRange.value);
        renderActiveTools();
        renderNow();
      });
      els.durationRange.addEventListener("change", () => {
        const cue = currentCue();
        if (!cue) return;
        cue.duration = Number(els.durationRange.value);
        save();
        render();
      });
      els.songScrub.addEventListener("pointerdown", () => {
        isSongScrubbing = true;
        if (!audio.src && currentCue()) loadCurrent(false);
      });
      els.songScrub.addEventListener("input", () => {
        isSongScrubbing = true;
        const seconds = Number(els.songScrub.value) || 0;
        els.scrubNow.textContent = fmt(seconds);
        if (audio.src && Number.isFinite(Number(audio.duration))) {
          audio.currentTime = Math.max(0, Math.min(Number(audio.duration), seconds));
        }
      });
      els.songScrub.addEventListener("change", () => {
        const seconds = Number(els.songScrub.value) || 0;
        if (audio.src && Number.isFinite(Number(audio.duration))) {
          audio.currentTime = Math.max(0, Math.min(Number(audio.duration), seconds));
        }
        isSongScrubbing = false;
        renderNow();
      });
      els.songScrub.addEventListener("pointerup", () => {
        isSongScrubbing = false;
        renderNow();
      });
      els.songScrub.addEventListener("pointercancel", () => {
        isSongScrubbing = false;
        renderNow();
      });
      els.fitSelect.addEventListener("change", () => {
        const cue = currentCue();
        if (!cue) return;
        cue.fit = els.fitSelect.value;
        save();
        render();
      });
      function nudge(seconds) {
        const cue = currentCue();
        if (!cue) return;
        setCueTime(cue, cueTime(cue) + seconds);
      }
      els.minus15.addEventListener("click", () => nudge(-15));
      els.minus1.addEventListener("click", () => nudge(-1));
      els.plus1.addEventListener("click", () => nudge(1));
      els.plus15.addEventListener("click", () => nudge(15));
      audio.addEventListener("play", render);
      audio.addEventListener("pause", render);
      audio.addEventListener("loadedmetadata", () => {
        const cue = currentCue();
        if (cue && Number.isFinite(audio.duration)) cue.runtime = audio.duration;
        render();
      });
      audio.addEventListener("timeupdate", renderNow);
      audio.addEventListener("ended", advanceAfterEnd);

      loadSaved();
      loadNotes();
      render();
      fetch("./VOLHOLLA/media-manifest.json", { cache: "no-cache" })
        .then((response) => response.ok ? response.json() : null)
        .then((manifest) => {
          if (manifest) {
            cachedManifest = manifest;
            applyManifest(manifest);
            probeDurations();
          }
          render();
        })
        .catch(() => render());
    })();
  </script>
</body>
</html>
